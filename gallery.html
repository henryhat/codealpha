    <title>Image Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

<!-- Lightbox -->

<div class="lightbox">

    <span class="close">&times;</span>

    <button id="prev">&#10094;</button>

    <img class="lightbox-img">

    <button id="next">&#10095;</button>

</div>

<script src="gallery.js"></script>
